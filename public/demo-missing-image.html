<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missing image preview</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111318;
        font-family: Arial, sans-serif;
        color: #f9fafb;
    }
    .preview {
        width: 360px;
        padding: 22px;
        border: 1px solid #2f3540;
        border-radius: 8px;
        background: #20242c;
    }
    .card {
        display: flex;
        gap: 11px;
        padding: 10px;
        border: 1px solid #343a46;
        border-radius: 10px;
        background: #1a1d24;
        align-items: stretch;
    }
    .ph {
        width: 76px;
        height: 76px;
        flex-shrink: 0;
        border: 1px solid #343a46;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
        color: #a7adbb;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6px;
        font-size: 10px;
        line-height: 1.15;
        font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
    }
    .info {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .name {
        font-size: 13px;
        line-height: 1.3;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .price {
        font-size: 14px;
        font-weight: 800;
        margin-bottom: auto;
    }
    .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }
    button {
        border: 1px solid #343a46;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        height: 36px;
        padding: 0 14px;
        font-weight: 700;
    }
    .buy {
        width: 44px;
        padding: 0;
        border: 0;
        background: #d63a00;
    }
</style>
</head>
<body>
    <div class="preview">
        <div class="card">
            <div class="ph">Nema slike</div>
            <div class="info">
                <div class="name">Primjer artikla bez slike u API-ju</div>
                <div class="price">379,90 KM</div>
                <div class="actions">
                    <button class="buy" type="button">🛒</button>
                    <button type="button">Detalji</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
