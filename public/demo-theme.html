<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat theme switch demo</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.65;
        max-width: 1040px;
        margin: 0 auto;
        padding: 48px 20px 120px;
        background: #f5f7fb;
        color: #111827;
    }
    h1 { margin-bottom: 4px; }
    .sub { color: #64748b; margin-top: 0; }
    .panel {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #fff;
    }
    code {
        background: #eef2f7;
        padding: 2px 6px;
        border-radius: 4px;
    }
</style>
</head>
<body>

<h1>Chat tema</h1>
<p class="sub">Otvori chat dolje desno i koristi ikonicu sunce/mjesec u headeru chata.</p>

<div class="panel">
    <p>Theme opcija je sada unutar samog chat prozora, pored minimize, novi razgovor i zatvori ikonica.</p>
    <p>Izbor se pamti u browseru, tako da nakon refresh-a ostaje zadnja odabrana tema.</p>
</div>

<script src="/public/embed.js"
        data-endpoint="/endpoint/chat.php"
        data-title="Digitalis AI asistent"
        data-logo="/public/logo-digitalis.svg"
        data-theme="dark"
        data-webshop="digitalis"
        defer></script>

</body>
</html>
