<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitalis chat — light tema</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.65;
        max-width: 1040px;
        margin: 0 auto;
        padding: 48px 20px 120px;
        background: #f7f8fb;
        color: #151922;
    }
    h1 { margin-bottom: 4px; }
    .sub { color: #64748b; margin-top: 0; }
    .panel {
        border: 1px solid #d8dee8;
        border-radius: 10px;
        padding: 18px 20px;
        margin-top: 22px;
        background: #fff;
    }
    code {
        background: #eef2f7;
        padding: 2px 6px;
        border-radius: 4px;
    }
</style>
</head>
<body>

<h1>Light tema</h1>
<p class="sub">Ovo je isti chatbot, samo sa <code>data-theme="light"</code>.</p>

<div class="panel">
    <p>Otvori chat dolje desno da vidiš bijelu verziju prozora, poruka, kartica i inputa.</p>
    <p>Dark tema ostaje default, tako da postojeće integracije neće promijeniti izgled dok se eksplicitno ne doda light.</p>
</div>

<script src="/public/embed.js"
        data-endpoint="/endpoint/chat.php"
        data-title="Digitalis AI asistent"
        data-logo="/public/logo-digitalis.svg"
        data-theme="light"
        data-webshop="digitalis"
        defer></script>

</body>
</html>
